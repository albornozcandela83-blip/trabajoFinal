<section class="card">

  <img [src]="producto.url" class="card-img-top" [alt]="producto.nombre">

  <div class="card-body">

    <h4 class="card-title">
      {{ producto.nombre }}
    </h4>

    <p class="card-text">
      ${{ producto.precio }}
    </p>

    <div class="acciones-producto">

      <button class="btn-card" (click)="agregarAlCarrito()">
        <span>+</span> Agregar al carrito
      </button>

    </div>

  </div>

</section>
